name: Fruit Classification MLOps CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          # ติดตั้ง libs ที่จำเป็นสำหรับการรัน Test (รวมถึง ONNX และ libs ภาพ)
          sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
          pip install -r deployment/api/requirements.txt
          pip install pytest httpx

      - name: Verify Model Files
        run: |
          echo "Checking for model files..."
          ls -la deployment/api/
          if [ -f "deployment/api/fruit_model.onnx" ]; then
            echo "✅ Model file found: $(ls -lh deployment/api/fruit_model.onnx)"
          else
            echo "❌ Model file NOT found"
          fi

      - name: Run Unit Tests
        timeout-minutes: 5  # ถ้าเกิน 5 นาทีให้ตัดทิ้งเลย
        run: |
          pytest tests/test_main.py

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Install Git LFS if not already available
          git lfs install
          
          # เพิ่ม Remote ของ Hugging Face
          git remote add hf https://Sirisak959:$HF_TOKEN@huggingface.co/spaces/Sirisak959/fruit-classification-app
          
          # ดึงข้อมูลล่าสุดจาก HF มาก่อนเพื่อป้องกัน Conflict
          git fetch hf main || true
          
          # Push with LFS support
          git push hf main